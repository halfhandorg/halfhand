name: docs

# The Halfhand docs are published only at https://halfhand.org/docs/, by the
# halfhandorg/halfhand.org repo, which renders this repo's docs/ folder at
# build time. This repo's docs/ stays the source of truth so docs ship in the
# same PR as the feature they describe.
#
# This workflow does two things:
#   1. Tells halfhand.org to rebuild when docs change (repository_dispatch).
#      Needs the DOCS_DISPATCH_TOKEN secret (fine-grained token with
#      "Contents: read and write" on halfhandorg/halfhand.org). Without it the
#      step is skipped and halfhand.org still picks changes up on its daily
#      scheduled build.
#   2. Keeps the retired GitHub Pages site (halfhandorg.github.io/halfhand/,
#      formerly an mdbook build) as redirect stubs, so old links and search
#      results land on the matching halfhand.org/docs page. Each stub has a
#      rel=canonical link and a meta refresh. Once search engines have caught
#      up, unpublish Pages in the repo settings and delete gh-pages; see
#      RELEASING.md.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "STABILITY.md"
      - "SECURITY.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write # peaceiris/actions-gh-pages pushes to the gh-pages branch

concurrency:
  group: docs-pages
  cancel-in-progress: true

jobs:
  notify-site:
    runs-on: ubuntu-latest
    steps:
      - name: Ask halfhand.org to rebuild its docs
        env:
          TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "DOCS_DISPATCH_TOKEN not set; halfhand.org will sync on its daily build."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/halfhandorg/halfhand.org/dispatches \
            -d '{"event_type":"docs-updated"}'

  redirect-stubs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate redirect stubs
        run: ./.github/scripts/docs-redirects.sh docs site

      - name: Deploy redirect stubs to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          force_orphan: true
