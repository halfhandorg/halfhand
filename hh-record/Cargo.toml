[package]
name = "hh-record"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Halfhand recorder: PTY runner, FS watcher, MCP proxy"
keywords = ["pty", "recorder", "watcher", "mcp", "halfhand"]
categories = ["development-tools", "filesystem"]

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
# See hh-core's `fuzzing` feature; same rationale, for the MCP proxy's
# line-classification logic.
fuzzing = ["hh-core/fuzzing"]
# Test-only fault injection for end-to-end tests of the `hh` binary (see
# `watcher::forced_unwatchable`). Enabled only by `hh`'s dev-dependency, so it
# is compiled into the binary `cargo test` runs and never into a release or
# `cargo install` build. Not a stable interface.
test-seams = []

[dependencies]
hh-core = { workspace = true }
# Justification: the recorder spawns the agent in a PTY.
portable-pty = "0.8"
# Justification: recursive filesystem watcher for file changes.
notify = "6"
# Justification: SIGTERM/SIGINT/SIGWINCH handling.
signal-hook = "0.3"
# Justification: raw terminal mode + size queries for transparent PTY
# proxy. Nominally an `hh` dependency but consumed by the recorder.
crossterm = "0.27"
# Justification: `.gitignore`-aware path filtering for the watcher.
# Nominally an `hh-core` dependency but consumed here; kept in
# hh-record to avoid widening hh-core's surface for the skeleton.
ignore = "0.4"
# Justification: library error enum (CLAUDE.md error standards).
thiserror = "1"
# Justification: serialization of event bodies (re-exported via hh-core, but
# the recorder builds JSON bodies directly).
serde_json = "1"

[dev-dependencies]
tempfile = "3"